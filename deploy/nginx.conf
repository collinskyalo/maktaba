# Maktaba — deploy/nginx.conf
# Serves the static frontend and reverse-proxies /api to the backend
# container. In production, terminate TLS here (or on a load balancer in
# front of this) — see docs/Deployment.md for a Let's Encrypt example.

server {
    listen 80;
    server_name _;

    # Frontend: plain static files, no build step.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets aggressively; HTML stays revalidated so deploys show up.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Backend API — proxied so the frontend can call a same-origin "/api/..."
    # in production instead of a hardcoded http://localhost:5000 (see the
    # API_BASE_URL comment in frontend/js/api.js).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:5000/health;
    }
}
