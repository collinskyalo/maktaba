<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password — Maktaba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html"><span>Maktaba</span></a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-card__subtitle">Enter your email and we'll send you a reset link.</p>

      <div class="form-message" id="formMessage" role="alert"></div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <p class="field-error" id="emailError"></p>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="submitBtn">Send reset link</button>
      </form>

      <p class="auth-foot"><a href="login.html">Back to log in</a></p>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
