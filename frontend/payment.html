<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay with M-Pesa — Maktaba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/payment.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html"><span>Maktaba</span></a>
    </div>
  </header>

  <main class="payment-page">
    <div class="payment-card">
      <div class="payment-summary">
        <div class="cover" id="paymentCover" style="background:#0F766E;"><span></span></div>
        <div>
          <h2 id="paymentBookTitle">Loading book…</h2>
          <p>Download as PDF after payment</p>
        </div>
      </div>

      <div class="payment-amount">
        <span class="label">Amount due</span>
        <span class="value">KSh 5</span>
      </div>

      <div class="form-message" id="formMessage" role="alert"></div>

      <form id="paymentForm" novalidate>
        <div class="field">
          <label for="phone">M-Pesa phone number</label>
          <input type="tel" id="phone" name="phone" placeholder="2547XXXXXXXX" autocomplete="tel" required>
          <p class="field-error" id="phoneError"></p>
        </div>
        <button type="submit" class="btn btn--gold btn--block" id="submitBtn">Pay with M-Pesa</button>
      </form>

      <div class="payment-status" id="paymentStatus"></div>
    </div>
  </main>

  <script type="module" src="js/payment.js"></script>
</body>
</html>
