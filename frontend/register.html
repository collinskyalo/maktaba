<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Maktaba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html"><span>Maktaba</span></a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-card__subtitle">Free to join. Reading is free — downloads are KSh 5.</p>

      <div class="form-message" id="formMessage" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
          <p class="field-error" id="nameError"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <p class="field-error" id="emailError"></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
          <p class="field-error" id="passwordError">Must be at least 8 characters.</p>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="submitBtn">Create account</button>
      </form>

      <div class="auth-divider">or</div>
      <button type="button" class="btn btn--google btn--block" id="googleBtn">Continue with Google</button>

      <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
